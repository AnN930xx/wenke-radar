name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'      # 日报归档 commit（bot 每日提交）不触发测试
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt pytest

      - name: 运行测试
        run: python -m pytest tests/ -q
