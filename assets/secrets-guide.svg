<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="把钥匙填进 GitHub Secrets 的四步示意">
  <defs>
    <filter id="cd" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B4713A" flood-opacity="0.14"/>
    </filter>
    <style>
      .zh { font-family: "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif; }
      .en { font-family: -apple-system,"Segoe UI",Helvetica,sans-serif; }
      .cap { font-size: 15px; fill: #5B5048; }
      .num { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .hl  { fill: none; stroke: #EE8B33; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="980" height="760" fill="#FDF8F0"/>
  <text class="zh" x="40" y="52" font-size="26" font-weight="700" fill="#231D16">
    把钥匙填进 GitHub 保险箱 · 一共点 4 次
  </text>
  <text class="zh" x="40" y="80" font-size="15" fill="#8B7B6B">
    下面是各步骤页面的示意（真实界面是英文，位置一样）
  </text>

  <!-- ① 仓库顶部菜单 → Settings -->
  <g filter="url(#cd)"><rect x="40" y="106" width="440" height="200" rx="14" fill="#FFFFFF"/></g>
  <circle cx="70" cy="136" r="15" fill="#EE8B33"/><text class="zh num" x="70" y="142" text-anchor="middle">1</text>
  <text class="zh" x="96" y="142" font-size="16" font-weight="700" fill="#231D16">在你自己的仓库里，点最右边的 Settings</text>

  <g class="en" font-size="12.5" fill="#57606A">
    <rect x="64" y="168" width="392" height="36" rx="6" fill="#F6F8FA" stroke="#D9DEE4"/>
    <text x="80" y="191">Code</text>
    <text x="124" y="191">Issues</text>
    <text x="178" y="191">Pull requests</text>
    <text x="268" y="191">Actions</text>
    <text x="322" y="191">Insights</text>
    <text x="384" y="191" font-weight="700" fill="#EE8B33">⚙ Settings</text>
    <rect x="374" y="172" width="78" height="28" rx="6" class="hl"/>
  </g>
  <path d="M 414 218 L 414 236" stroke="#EE8B33" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 408 229 L 414 237 L 420 229" fill="none" stroke="#EE8B33" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text class="zh cap" x="64" y="262">⚠️ 是这一排最右边的 Settings，</text>
  <text class="zh cap" x="64" y="284">不是右上角你头像里的那个账号设置</text>

  <!-- ② 左侧菜单 -->
  <g filter="url(#cd)"><rect x="500" y="106" width="440" height="200" rx="14" fill="#FFFFFF"/></g>
  <circle cx="530" cy="136" r="15" fill="#EE8B33"/><text class="zh num" x="530" y="142" text-anchor="middle">2</text>
  <text class="zh" x="556" y="142" font-size="16" font-weight="700" fill="#231D16">左边菜单往下拉，点开 Secrets → Actions</text>

  <g class="en" font-size="12.5" fill="#57606A">
    <rect x="524" y="164" width="200" height="124" rx="6" fill="#F6F8FA" stroke="#D9DEE4"/>
    <text x="540" y="184">General</text>
    <text x="540" y="206">Collaborators</text>
    <text x="540" y="228">Branches</text>
    <text x="540" y="250" font-weight="700" fill="#EE8B33">Secrets and variables</text>
    <rect x="532" y="236" width="184" height="20" rx="4" class="hl"/>
    <text x="556" y="272" font-weight="700" fill="#EE8B33">└ Actions</text>
    <rect x="548" y="259" width="76" height="19" rx="4" class="hl"/>
  </g>
  <text class="zh cap" x="740" y="200">先点</text>
  <text class="zh cap" x="740" y="222" font-weight="700">Secrets and variables</text>
  <text class="zh cap" x="740" y="248">展开后再点里面的</text>
  <text class="zh cap" x="740" y="270" font-weight="700">Actions</text>

  <!-- ③ 绿色按钮 -->
  <g filter="url(#cd)"><rect x="40" y="330" width="440" height="188" rx="14" fill="#FFFFFF"/></g>
  <circle cx="70" cy="360" r="15" fill="#EE8B33"/><text class="zh num" x="70" y="366" text-anchor="middle">3</text>
  <text class="zh" x="96" y="366" font-size="16" font-weight="700" fill="#231D16">点右上角那个绿色按钮</text>

  <g>
    <rect x="64" y="392" width="392" height="76" rx="8" fill="#F6F8FA" stroke="#D9DEE4"/>
    <text class="en" x="84" y="420" font-size="13" fill="#57606A">Repository secrets</text>
    <rect x="288" y="404" width="152" height="30" rx="6" fill="#1F883D"/>
    <text class="en" x="364" y="424" font-size="12" fill="#FFFFFF" text-anchor="middle">New repository secret</text>
    <rect x="282" y="398" width="164" height="42" rx="9" class="hl"/>
    <text class="en" x="84" y="452" font-size="12" fill="#8C959F">（这里现在还是空的，填完就会出现一行）</text>
  </g>
  <text class="zh cap" x="64" y="496">按钮上写的是 New repository secret</text>

  <!-- ④ 填两个框 -->
  <g filter="url(#cd)"><rect x="500" y="330" width="440" height="188" rx="14" fill="#FFFFFF"/></g>
  <circle cx="530" cy="360" r="15" fill="#EE8B33"/><text class="zh num" x="530" y="366" text-anchor="middle">4</text>
  <text class="zh" x="556" y="366" font-size="16" font-weight="700" fill="#231D16">填这两个框，然后保存</text>

  <g class="en" font-size="12.5">
    <text x="524" y="400" fill="#57606A">Name</text>
    <rect x="524" y="408" width="392" height="30" rx="6" fill="#FFFFFF" stroke="#EE8B33" stroke-width="2"/>
    <text x="538" y="428" font-weight="700" fill="#231D16">PUSH_KEY</text>

    <text x="524" y="458" fill="#57606A">Secret</text>
    <rect x="524" y="466" width="392" height="30" rx="6" fill="#FFFFFF" stroke="#D9DEE4"/>
    <text x="538" y="486" fill="#57606A">SCT123456xxxxxxxxxxxxxxxx</text>
  </g>
  <text class="zh cap" x="524" y="514">上面必须一字不差是 PUSH_KEY，下面粘贴你的钥匙</text>

  <!-- 成功的样子 -->
  <g filter="url(#cd)"><rect x="40" y="542" width="900" height="180" rx="14" fill="#FFFFFF"/></g>
  <text class="zh" x="70" y="578" font-size="17" font-weight="700" fill="#231D16">✅ 成功之后你会看到这样一行（这就完成了）</text>

  <g>
    <rect x="70" y="598" width="840" height="46" rx="8" fill="#F6F8FA" stroke="#D9DEE4"/>
    <circle cx="96" cy="621" r="10" fill="#E8EDF2"/>
    <path d="M 92 621 L 95 625 L 101 617" fill="none" stroke="#57606A" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text class="en" x="118" y="626" font-size="13.5" font-weight="700" fill="#1F2328">PUSH_KEY</text>
    <text class="en" x="740" y="626" font-size="12.5" fill="#8C959F">Updated now</text>
  </g>
  <text class="zh" x="70" y="672" font-size="15" fill="#5B5048">
    点进去看不到里面的内容 —— 这是正常的，说明它被加密保管好了。
  </text>
  <text class="zh" x="70" y="698" font-size="15" font-weight="700" fill="#C2701F">
    到这里就彻底结束了，以后每天早上程序自己会去取这把钥匙，你不用再碰它。
  </text>
</svg>
