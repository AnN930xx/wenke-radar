<svg viewBox="0 0 1280 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不绝望的文科生秋招">
  <defs>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8B64C"/>
      <stop offset="0.55" stop-color="#EE8B33"/>
      <stop offset="1" stop-color="#DC652A"/>
    </linearGradient>
    <radialGradient id="icglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.78" cy="0.3" r="0.62">
      <stop offset="0" stop-color="#F8B64C" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F8B64C" stop-opacity="0"/>
    </radialGradient>
    <filter id="card" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B4713A" flood-opacity="0.16"/>
    </filter>
    <style>
      .zh { font-family: "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="440" fill="#FDF8F0"/>
  <rect width="1280" height="440" fill="url(#warm)"/>

  <!-- 右侧雷达波纹背景 -->
  <g fill="none" stroke="#E89A45" stroke-linecap="round" opacity="0.20">
    <path d="M 740 440 A 240 240 0 0 1 1220 440" stroke-width="2.5"/>
    <path d="M 805 440 A 175 175 0 0 1 1155 440" stroke-width="2.5"/>
    <path d="M 870 440 A 110 110 0 0 1 1090 440" stroke-width="2.5"/>
  </g>

  <!-- 图标 -->
  <g transform="translate(80,118) scale(0.1875)">
    <rect width="512" height="512" rx="118" fill="url(#ic)"/>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M 120 320 A 136 136 0 0 1 392 320" stroke-width="15" opacity="0.26"/>
      <path d="M 160 320 A 96 96 0 0 1 352 320" stroke-width="15" opacity="0.44"/>
      <path d="M 200 320 A 56 56 0 0 1 312 320" stroke-width="15" opacity="0.66"/>
    </g>
    <circle cx="352" cy="186" r="48" fill="url(#icglow)"/>
    <circle cx="352" cy="186" r="17" fill="#FFFFFF"/>
    <g fill="#FFFFFF">
      <path d="M 134 328 C 176 304 226 308 254 332 L 254 378 C 226 354 176 350 134 374 Z"/>
      <path d="M 378 328 C 336 304 286 308 258 332 L 258 378 C 286 354 336 350 378 374 Z"/>
    </g>
  </g>

  <!-- 标题区 -->
  <text class="zh" x="210" y="184" font-size="58" font-weight="700" fill="#231D16"
        letter-spacing="1">不绝望的文科生秋招</text>
  <text class="zh" x="212" y="228" font-size="21" fill="#7C6D5E">
    每天早上，把「今天新放出的对口岗位」直接推到你微信
  </text>

  <!-- 能力标签 -->
  <g class="zh" font-size="17" fill="#B4601F">
    <rect x="212" y="262" width="146" height="38" rx="19" fill="#FFFFFF" stroke="#F0D5B0"/>
    <text x="285" y="286" text-anchor="middle">45 个官方源</text>
    <rect x="370" y="262" width="146" height="38" rx="19" fill="#FFFFFF" stroke="#F0D5B0"/>
    <text x="443" y="286" text-anchor="middle">12 大求职方向</text>
    <rect x="528" y="262" width="160" height="38" rx="19" fill="#FFFFFF" stroke="#F0D5B0"/>
    <text x="608" y="286" text-anchor="middle">只报「今日新增」</text>
  </g>

  <!-- 右侧：推送到手机的岗位卡片 -->
  <g class="zh" filter="url(#card)">
    <rect x="800" y="112" width="356" height="66" rx="16" fill="#FFFFFF"/>
    <rect x="824" y="192" width="332" height="66" rx="16" fill="#FFFFFF"/>
    <rect x="800" y="272" width="356" height="66" rx="16" fill="#FFFFFF"/>
  </g>
  <g class="zh">
    <circle cx="828" cy="145" r="6" fill="#EE8B33"/>
    <text x="848" y="139" font-size="19" font-weight="700" fill="#2B231B">⭐ 内容运营（抖音电商）</text>
    <text x="848" y="163" font-size="15" fill="#9A8B7B">字节跳动 · 上海 · 社招</text>

    <circle cx="852" cy="225" r="6" fill="#EE8B33"/>
    <text x="872" y="219" font-size="19" font-weight="700" fill="#2B231B">品牌策划管培生</text>
    <text x="872" y="243" font-size="15" fill="#9A8B7B">泡泡玛特 · 北京 · 2026 届</text>

    <circle cx="828" cy="305" r="6" fill="#EE8B33"/>
    <text x="848" y="299" font-size="19" font-weight="700" fill="#2B231B">⭐ 展览策划助理</text>
    <text x="848" y="323" font-size="15" fill="#9A8B7B">UCCA · 北京 · 校招正式岗</text>
  </g>

  <!-- 底部一句话 -->
  <text class="zh" x="212" y="360" font-size="15" fill="#A2907E">
    产品 · 运营 · 电商 · 策展 · 增长营销 · 市场公关 · 媒体内容 · 商业分析 · 人力行政 · 项目客户 · 销售 · 设计创意
  </text>
</svg>
