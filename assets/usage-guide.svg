<svg viewBox="0 0 980 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="怎么用：四步图解">
  <defs>
    <filter id="cd2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B4713A" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="ic3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8B64C"/>
      <stop offset="1" stop-color="#DC652A"/>
    </linearGradient>
    <style>
      .zh { font-family: "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif; }
      .en { font-family: -apple-system,"Segoe UI",Helvetica,sans-serif; }
      .t  { font-size: 20px; font-weight: 700; fill: #231D16; }
      .d  { font-size: 15px; fill: #5B5048; }
      .m  { font-size: 14px; fill: #8B7B6B; }
      .num { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .hl { fill: none; stroke: #EE8B33; stroke-width: 2.5; }
      .warn { font-size: 14px; fill: #C2701F; }
    </style>
  </defs>

  <rect width="980" height="1180" fill="#FDF8F0"/>
  <text class="zh" x="40" y="56" font-size="28" font-weight="700" fill="#231D16">怎么用 · 四步，五分钟，不用会代码</text>

  <!-- 连接线 -->
  <line x1="76" y1="120" x2="76" y2="1060" stroke="#F0D5B0" stroke-width="3"/>

  <!-- ① Fork -->
  <circle cx="76" cy="140" r="20" fill="#EE8B33"/><text class="zh num" x="76" y="147" text-anchor="middle">1</text>
  <g filter="url(#cd2)"><rect x="116" y="106" width="824" height="190" rx="14" fill="#FFFFFF"/></g>
  <text class="zh t" x="144" y="146">Fork：把这个仓库复制一份给自己</text>
  <text class="zh d" x="144" y="176">点本页<tspan font-weight="700">右上角的 Fork 按钮</tspan> → 建议勾上 Private → Create fork</text>

  <g class="en" font-size="12.5">
    <rect x="144" y="196" width="330" height="34" rx="7" fill="#F6F8FA" stroke="#D9DEE4"/>
    <text x="162" y="218" fill="#57606A">⭐ Star</text>
    <rect x="238" y="201" width="70" height="24" rx="5" fill="#F6F8FA" stroke="#8C959F"/>
    <text x="252" y="218" fill="#1F2328" font-weight="700">⑂ Fork</text>
    <rect x="232" y="196" width="82" height="34" rx="8" class="hl"/>
    <text x="330" y="218" fill="#8C959F">← 点这个</text>
  </g>
  <text class="zh d" x="144" y="258">成功标志：网址变成 github.com/<tspan font-weight="700" fill="#C2701F">你的用户名</tspan>/wenke-radar</text>
  <text class="zh m" x="144" y="282">然后点 Actions 标签页，按绿色按钮把自动运行打开（没有 GitHub 账号先去 github.com/signup 免费注册）</text>

  <!-- ② Server酱 -->
  <circle cx="76" cy="360" r="20" fill="#EE8B33"/><text class="zh num" x="76" y="367" text-anchor="middle">2</text>
  <g filter="url(#cd2)"><rect x="116" y="326" width="824" height="216" rx="14" fill="#FFFFFF"/></g>
  <text class="zh t" x="144" y="366">拿一把「往你微信发消息」的钥匙</text>
  <text class="zh d" x="144" y="396">打开 <tspan font-weight="700">sct.ftqq.com</tspan>（Server酱，免费）→ 微信扫码登录 → SendKey 页面<tspan font-weight="700">复制那串 SCT 开头的钥匙</tspan></text>

  <g>
    <rect x="144" y="416" width="420" height="38" rx="7" fill="#F6F8FA" stroke="#D9DEE4"/>
    <text class="en" x="162" y="440" font-size="13" fill="#57606A">SCT123456xxxxxxxxxxxxxxxxxxxx</text>
    <rect x="444" y="422" width="104" height="26" rx="6" fill="#EE8B33"/>
    <text class="zh" x="496" y="440" font-size="13" fill="#FFFFFF" text-anchor="middle">复制并存好</text>
  </g>
  <text class="zh warn" x="144" y="486">⚠️ 同一页面会让你关注「方糖」服务号——一定要关注，不然消息进不了微信</text>
  <text class="zh d" x="144" y="514">关注完点一下「发送测试消息」，微信收到了 = 这把钥匙是通的 ✅</text>

  <!-- ③ Secrets -->
  <circle cx="76" cy="606" r="20" fill="#EE8B33"/><text class="zh num" x="76" y="613" text-anchor="middle">3</text>
  <g filter="url(#cd2)"><rect x="116" y="572" width="824" height="248" rx="14" fill="#FFFFFF"/></g>
  <text class="zh t" x="144" y="612">把钥匙存进你仓库的「保险箱」⭐ 最关键</text>
  <text class="zh d" x="144" y="642">在<tspan font-weight="700">你自己的仓库</tspan>里：<tspan class="en" font-weight="700">Settings → Secrets and variables → Actions → New repository secret</tspan></text>

  <g class="en" font-size="13">
    <text x="144" y="678" fill="#8B7B6B" class="zh">Name 填</text>
    <rect x="216" y="660" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#EE8B33" stroke-width="2"/>
    <text x="230" y="679" font-weight="700" fill="#231D16">PUSH_KEY</text>
    <text x="380" y="678" fill="#8B7B6B" class="zh">（一个字母都不能差）</text>
  </g>
  <g class="en" font-size="13">
    <text x="144" y="716" fill="#8B7B6B" class="zh">Secret 填</text>
    <rect x="216" y="698" width="300" height="28" rx="6" fill="#FFFFFF" stroke="#D9DEE4"/>
    <text x="230" y="717" fill="#57606A">粘贴第②步那串钥匙</text>
    <text x="530" y="716" fill="#8B7B6B" class="zh">→ 点 Add secret 保存</text>
  </g>
  <text class="zh d" x="144" y="756">✅ 列表出现一行 <tspan class="en" font-weight="700">PUSH_KEY · Updated now</tspan> = 成功（点进去看不到内容是正常的）</text>
  <text class="zh m" x="144" y="784">为什么不写进代码？代码会被看见；保险箱是加密的，日志里只显示 ***。想多人接收：多把钥匙用英文逗号连起来填</text>
  <text class="zh m" x="144" y="806">👇 这一步的逐屏图解见下方大图</text>

  <!-- ④ 跑一次 -->
  <circle cx="76" cy="884" r="20" fill="#EE8B33"/><text class="zh num" x="76" y="891" text-anchor="middle">4</text>
  <g filter="url(#cd2)"><rect x="116" y="850" width="824" height="180" rx="14" fill="#FFFFFF"/></g>
  <text class="zh t" x="144" y="890">手动跑一次，验证能收到</text>
  <text class="zh d" x="144" y="920"><tspan class="en" font-weight="700">Actions</tspan> 标签页 → 左边选 <tspan font-weight="700">秋招雷达日报</tspan> → 右边 <tspan class="en" font-weight="700">Run workflow</tspan> → 绿色按钮</text>

  <g>
    <rect x="144" y="940" width="230" height="34" rx="7" fill="#1F883D"/>
    <text class="en" x="259" y="962" font-size="13.5" fill="#FFFFFF" text-anchor="middle">Run workflow</text>
    <rect x="138" y="934" width="242" height="46" rx="9" class="hl"/>
  </g>
  <text class="zh d" x="410" y="962">→ 约 10 分钟后微信收到推送 🎉</text>
  <text class="zh m" x="144" y="1008">之后每天早上 7:30 前后自动推送，你什么都不用管；最迟中午前一定到，一天只推一次</text>

  <!-- 底部 -->
  <text class="zh" x="490" y="1096" font-size="16" text-anchor="middle" fill="#C2701F" font-weight="700">
    卡住了？README 里有「把这段话复制给 AI」——让 AI 一步步带你做
  </text>
  <text class="zh" x="490" y="1132" font-size="13.5" text-anchor="middle" fill="#A2907E">
    唯一要保密的是那串 SCT 钥匙：别写进代码、别发群、也别发给 AI
  </text>
</svg>
