<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不绝望的文科生秋招 图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8B64C"/>
      <stop offset="0.55" stop-color="#EE8B33"/>
      <stop offset="1" stop-color="#DC652A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- 雷达波：从书页向上扩散 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M 120 320 A 136 136 0 0 1 392 320" stroke-width="15" opacity="0.26"/>
    <path d="M 160 320 A 96 96 0 0 1 352 320" stroke-width="15" opacity="0.44"/>
    <path d="M 200 320 A 56 56 0 0 1 312 320" stroke-width="15" opacity="0.66"/>
  </g>

  <!-- 捕捉到的岗位信号 -->
  <circle cx="352" cy="186" r="48" fill="url(#glow)"/>
  <circle cx="352" cy="186" r="17" fill="#FFFFFF"/>

  <!-- 摊开的书：文科生的底色 -->
  <g fill="#FFFFFF">
    <path d="M 134 328 C 176 304 226 308 254 332 L 254 378 C 226 354 176 350 134 374 Z"/>
    <path d="M 378 328 C 336 304 286 308 258 332 L 258 378 C 286 354 336 350 378 374 Z"/>
  </g>
  <g stroke="#EE8B33" stroke-width="7" stroke-linecap="round" opacity="0.4">
    <path d="M 168 338 L 224 344"/>
    <path d="M 288 344 L 344 338"/>
  </g>
</svg>
